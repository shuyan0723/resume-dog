server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: resume-dog

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:resume_dog}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      # 生产环境用 validate，把 schema 变更的唯一入口留给 Flyway
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  thymeleaf:
    cache: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ---------------------------------------------------------------- Claude API
claude:
  # 留空则回落到环境变量 ANTHROPIC_API_KEY
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${CLAUDE_MODEL:claude-opus-5-5}
  max-tokens: 16000
  effort: HIGH
  cache-ttl: 1h
  # true 时不调用真实 API，返回内置示例数据，方便前端在无 Key 环境下联调
  mock: ${CLAUDE_MOCK:false}

# ---------------------------------------------------------------- 鉴权
jwt:
  # 生产环境必须用环境变量覆盖；泄露等同于任意用户身份伪造
  secret: ${JWT_SECRET:change-me-in-production-at-least-32-bytes-long}
  expire-minutes: 10080

# ---------------------------------------------------------------- 文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.resumedog: INFO
    com.anthropic: WARN
